name: VITAS cron (external scheduler)

# WHY THIS EXISTS
# Vercel's own cron scheduler silently stopped firing (last successful run 2026-07-09 18:32 UTC).
# Everything on Vercel looked healthy — Pro plan, budget fine, Cron Jobs "Enabled", production
# deployment Ready — and a redeploy did NOT revive it. The production domain itself is fully
# reachable, so we schedule from GitHub Actions instead and no longer depend on Vercel's scheduler.
#
# SETUP (one-time): add a repository secret named CRON_SECRET with the SAME value as the
# CRON_SECRET environment variable in Vercel.
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#
# Schedules are UTC. 04:30-18:30 UTC == 07:30-21:30 Israel time (same as vercel.json).

on:
  schedule:
    - cron: '7 4,6,8,10,12,14,16,18 * * *'    # prefetch-ads HOT (odd minute: GH delays :00/:30 heavily)
    - cron: '27 3 * * *'                      # prefetch-ads COLD — רבעונים וחודשים סגורים, פעם ביום
    - cron: '17 4,6,8,10,12,14,16,18 * * *'   # prefetch-crm (months — fast, critical)
    - cron: '37 4,6,8,10,12,14,16,18 * * *'   # prefetch-crm (ranges — own 300s budget)
    - cron: '47 * * * *'                      # health watchdog
  workflow_dispatch:
    inputs:
      target:
        description: 'Which cron to run'
        required: true
        default: 'all'
        type: choice
        # fireberry-notes: ידני בלבד — מילוי ראשוני של פרויקט חדש (240 שניות לריצה). הסנכרון השוטף
        # רץ כל שעה בתוך prefetch-daily (cron-job.org); כאן הוא דולג ברוב הלילות, ושתי ריצות
        # במקביל עלולות לעבור את מגבלת 100 הקריאות לדקה של Fireberry.
        options: [all, prefetch-ads, prefetch-crm, health, fireberry-notes]

concurrency:
  group: vitas-cron-${{ github.event.schedule || github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve which endpoint(s) to call
        id: t
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '7 4,6,8,10,12,14,16,18 * * *')  echo 'paths=prefetch-ads?mode=hot' >> "$GITHUB_OUTPUT" ;;
              '27 3 * * *')                    echo 'paths=prefetch-ads?mode=cold' >> "$GITHUB_OUTPUT" ;;
              '17 4,6,8,10,12,14,16,18 * * *') echo 'paths=prefetch-crm?only=months' >> "$GITHUB_OUTPUT" ;;
              '37 4,6,8,10,12,14,16,18 * * *') echo 'paths=prefetch-crm?only=ranges' >> "$GITHUB_OUTPUT" ;;
              '47 * * * *')                    echo 'paths=health'       >> "$GITHUB_OUTPUT" ;;
              *)                               echo 'paths=health'       >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ "${{ github.event.inputs.target }}" = "all" ]; then
            echo 'paths=prefetch-ads prefetch-crm health' >> "$GITHUB_OUTPUT"
          else
            echo 'paths=${{ github.event.inputs.target }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Call cron endpoint(s)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing repository secret CRON_SECRET (see header of this file)"
            exit 1
          fi
          fail=0
          for p in ${{ steps.t.outputs.paths }}; do
            url="https://reports.vitas.co.il/api/cron/$p"
            # wait=1: הקרונים עונים מיד וממשיכים ברקע (B16, בשביל cron-job.org שמנתק אחרי
            # 30 שניות). כאן ממתינים לתוצאה המלאה, כדי שהקוד וה-JSON בלוג יהיו של הריצה עצמה.
            case "$p" in *\?*) url="$url&wait=1" ;; *) url="$url?wait=1" ;; esac
            echo "::group::$p"
            code=000
            # Retry transient failures (HTTP 000 connection drop / 5xx). A single dropped
            # connection to Vercel would otherwise fail the whole run. 4xx = real error, no retry.
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 600 \
                -H "Authorization: Bearer $CRON_SECRET" "$url" || echo 000)
              echo "attempt $attempt: HTTP $code"
              case "$code" in
                200) break ;;
                000|5*) [ "$attempt" -lt 3 ] && { echo "transient — retrying in 20s"; sleep 20; } ;;
                *) break ;;
              esac
            done
            head -c 1000 /tmp/out.json 2>/dev/null || true; echo
            if [ "$code" != "200" ]; then
              fail=1
              echo "::error::$p returned HTTP $code after retries"
            fi
            echo "::endgroup::"
          done
          exit $fail
